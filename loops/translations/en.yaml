configuration:
  run_at:
    name: Run at
    description: Local time of the nightly run, HH:MM.
  notify_target:
    name: Notify target
    description: notify service name for the summary, e.g. mobile_app_pixel. Empty sends nothing.
  override_window_s:
    name: Override window (s)
    description: A manual change this soon after an automation changed the same entity counts as an override.
  backup_max_age_days:
    name: Backup max age (days)
    description: A newest backup older than this is a finding.
  disk_warn_percent:
    name: Disk warning (%)
    description: Host disk use above this is a finding.
  unavailable_warn_delta:
    name: Unavailable delta
    description: This many more unavailable or unknown entities than the previous run is a finding.
  log_lines:
    name: Core log lines
    description: How many recent core log lines to scan for errors and warnings.
  kuma_url:
    name: Uptime Kuma URL
    description: Optional. Down monitors become findings.
  kuma_api_key:
    name: Uptime Kuma API key
    description: A key of its own for this add-on.
  kuma_ignore:
    name: Ignored monitors
    description: Monitor names whose down state is normal, such as machines that are off unless needed.
  memory_url:
    name: Agent memory URL
    description: The agent-memory add-on, whose nightly candidate review the run reports. Absent means http://10.20.52.10:8765; empty turns the check off.
  collector_url:
    name: Options collector URL
    description: The options collector add-on, whose weekday run the check reads from /runs. Absent means http://local-collector:8092; empty turns the check off.
  hvac_zones:
    name: HVAC zones
    description: One entry per zone, name=statistic_id[,statistic_id], the energy statistics of every circuit that runs it (compressor and air handler). Empty turns loop 7 off.
  outdoor_temperature:
    name: Outdoor temperature
    description: The statistic id of an outdoor temperature sensor with hourly means.
  controller_arm:
    name: Controller arm
    description: A label for the thermostat settings in force, recorded on each new day, so weeks under different settings are compared by arm.
  controller_from:
    name: Measure from
    description: First local day of the HVAC measurement, YYYY-MM-DD. Empty means the last 30 days.
  energy_meter:
    name: Energy meter
    description: The statistic id of the panel's total energy. An hour it did not move is an hour the meter was not reporting, and every circuit's reading for that hour counts as missing.
