name: Loops
version: "0.13.1"
slug: loops
description: Nightly health checks of Home Assistant, and the automations people undo by hand
url: https://github.com/heidrickla/ha-loops
arch:
  - amd64
  - aarch64
startup: services
init: false
homeassistant_api: true
hassio_api: true
hassio_role: homeassistant
ingress: true
ingress_port: 8095
panel_icon: mdi:sync-circle
panel_title: Loops
# Everything else is optional and has a default; the checks that need a service of their own
# (Uptime Kuma, UniFi, agent memory, the options collector, HVAC zones) stay off until it is set.
options:
  run_at: "03:30"
  notify_target: ""
schema:
  run_at: match(^([01]\d|2[0-3]):[0-5]\d$)
  notify_target: str?
  override_window_s: int(30,3600)?
  backup_max_age_days: int(1,90)?
  disk_warn_percent: int(50,99)?
  unavailable_warn_delta: int(1,1000)?
  log_lines: int(100,5000)?
  kuma_url: url?
  kuma_api_key: password?
  kuma_ignore:
    - str?
  memory_url: str?
  collector_url: str?
  hvac_zones:
    - match(^[^=,]+=[^=,]+(,[^=,]+)*$)?
  outdoor_temperature: str?
  controller_arm: match(^[A-Za-z0-9_.-]{1,40}$)?
  controller_from: match(^(\d{4}-\d{2}-\d{2})?$)?
  energy_meter: str?
  unifi_url: str?
  unifi_username: str?
  unifi_password: password?
  unifi_fingerprint: match(^([0-9A-Fa-f]{2}:?){31}[0-9A-Fa-f]{2}$|^$)?
  unifi_verify_tls: bool?
  isolated_networks:
    - str?
  camera_network: str?
  network_dismiss:
    - str?
  api_peers:
    - str?
